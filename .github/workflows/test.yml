# Runs the test suite on every pull request and on pushes to main, so a PR gets
# a real pass/fail check and a broken main is caught before a release tag
# rather than at it. The release workflow repeats the run on the tagged commit.
name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false

      # No install step: the project has zero dependencies (see AGENTS.md). A
      # change that adds one must add an install step back before `npm test`.
      - run: npm test
